name: CLI Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cli_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Godot Action
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: "4.7.1"
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Run score calculate test
        run: godot --headless --path . --script tests/score_calculator/score_calculator_test.gd

      - name: Run stage test
        run: godot --headless --path . --script tests/stage/stage_test.gd
